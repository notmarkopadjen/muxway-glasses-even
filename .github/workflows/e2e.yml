name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      # Actions are pinned to commit SHAs; the tag is in the comment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The suite builds the hub from the core repository. A public core is
      # read with the job's own token; a private one needs MUXWAY_CORE_TOKEN,
      # and without either the suite runs on developers' machines only.
      - name: Check out the core repository
        id: core
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: notmarkopadjen/muxway
          token: ${{ secrets.MUXWAY_CORE_TOKEN || github.token }}
          path: muxway-core
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: steps.core.outcome == 'success'
        with:
          go-version-file: muxway-core/go.mod
          cache: false

      - name: Run end-to-end tests
        id: run
        if: steps.core.outcome == 'success'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tmux xvfb libwebkit2gtk-4.1-0
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          echo "suite=yes" >> "$GITHUB_OUTPUT"
          MUXWAY_CORE=muxway-core scripts/e2e.sh

      - name: Keep logs, screenshots and traces
        if: always() && steps.run.outputs.suite == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-run-${{ github.run_id }}
          path: test-runs/
          retention-days: 90

      # A pull request from a fork runs with a read-only token and cannot
      # write check runs; its results are in the artifact and the job log.
      - name: Check run with per-test results
        if: always() && steps.run.outputs.suite == 'yes' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: dorny/test-reporter@dc3a92680fcc15842eef52e8c4606ea7ce6bd3f3 # v2.1.1
        with:
          name: e2e results
          path: test-runs/*/results.xml
          reporter: java-junit

      - name: Record the run as an issue
        if: always() && steps.run.outputs.suite == 'yes' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/record-run.sh test-runs/*/
